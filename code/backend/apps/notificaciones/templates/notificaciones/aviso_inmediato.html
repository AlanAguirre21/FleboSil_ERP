<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ titulo }} — FleboSil</title>
  </head>
  <body style="margin:0; padding:0; background-color:#fbf8f6; font-family:Arial, Helvetica, sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#fbf8f6; padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px; background-color:#ffffff; border-radius:16px; overflow:hidden;">
            <tr>
              <td align="center" style="padding:32px 32px 8px 32px;">
                <img src="cid:logo_flebosil" alt="FleboSil" width="180" style="display:block; max-width:180px; height:auto; border:0;" />
              </td>
            </tr>
            <tr>
              <td style="padding:8px 32px 0 32px; text-align:center;">
                <p style="margin:0 0 10px 0;">
                  <span style="padding:3px 10px; font-size:11px; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:#c62828; background-color:#f9e2e2; border-radius:9999px;">Aviso inmediato</span>
                </p>
                <h1 style="margin:0; font-size:20px; line-height:1.3; color:#241f26; font-weight:600;">{{ titulo }}</h1>
                <p style="margin:8px 0 0 0; font-size:14px; line-height:1.5; color:#6b6470;">{{ detalle }}</p>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding:24px 32px 32px 32px;">
                <a href="{{ url_elemento }}" style="display:inline-block; padding:12px 24px; background-color:#a6295f; color:#ffffff; font-size:14px; font-weight:600; text-decoration:none; border-radius:9999px;">Ver en FleboSil</a>
              </td>
            </tr>
            <tr>
              <td style="padding:20px 32px; background-color:#fbf8f6; text-align:center; border-top:1px solid #ebe2e6;">
                <p style="margin:0 0 6px 0; font-size:12px; color:#9b93a0;">
                  Recibes este correo por ser administrador. <a href="{{ url_preferencias }}" style="color:#a6295f;">Cambiar avisos por correo</a>
                </p>
                <p style="margin:0; font-size:12px; color:#9b93a0;">FleboSil · Serenidad para tus piernas</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
